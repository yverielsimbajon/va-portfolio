<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<title>Food poster samples 3</title>
<!-- Source for images/fp3-1..10.jpg. Open with ?p=1..10, screenshot at 1080x1350. Brands, logos, prices and phone numbers are made up. Food photos are Pexels stock photos (background removed). -->
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Caveat:wght@600;700&family=Paytone+One&family=Kaushan+Script&family=Bebas+Neue&family=Luckiest+Guy&family=Allura&family=Alfa+Slab+One&family=Anton&family=Permanent+Marker&family=Dancing+Script:wght@700&family=Fredoka:wght@500;600;700&family=Lobster&family=Cinzel:wght@600;700;800&family=Archivo+Black&family=Poppins:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Sacramento&family=Pacifico&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:Poppins,sans-serif;color:#fff;background:#111}
.a{position:absolute}
.cut{position:absolute;filter:drop-shadow(0 36px 34px rgba(0,0,0,.42)) drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.soft{filter:drop-shadow(0 22px 22px rgba(0,0,0,.28))}
.circ{position:absolute;border-radius:50%}
.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.38;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.1 -.2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38) 100%)}
.ico{width:34px;height:34px;fill:currentColor}
.ct{position:absolute;left:0;display:flex;align-items:center;gap:12px;font-weight:600;font-size:26px;white-space:nowrap}
.ct svg{width:30px;height:30px;fill:currentColor;flex:none}
.soc{position:absolute;display:flex;gap:14px}
.soc i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor}
.soc svg{width:24px;height:24px;fill:currentColor}
.burst{position:absolute;display:grid;place-items:center;text-align:center;line-height:1}
.pill{position:absolute;padding:20px 46px;border-radius:99px;font-weight:700;font-size:32px;letter-spacing:.02em;white-space:nowrap}
.stroke{-webkit-text-stroke:3px currentColor;color:transparent}
.logo{position:absolute;display:flex;align-items:center;gap:14px;white-space:nowrap}
.logo .t{font-weight:800;line-height:1}
.logo .t small{display:block;font-size:.4em;font-weight:600;letter-spacing:.24em;opacity:.85;margin-top:7px;line-height:1;text-transform:uppercase}
</style><script src="/protect.js"></script>
</head>
<body><div id="app"></div>
<script>
const C = "cut/";
let _s = 7;
const rnd = () => (_s = (_s * 16807) % 2147483647) / 2147483647;
const seed = n => { _s = n; };
/* icons */
const I = {
  phone: '<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"/></svg>',
  globe: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 9h-3a15.7 15.7 0 0 0-1.4-6A8 8 0 0 1 18.9 11zM12 4c.9 1.2 1.8 3.200 2 7h-4c.2-3.800 1.100-5.800 2-7zM4.100 13h3a15.700 15.700 0 0 0 1.400 6A8 8 0 0 1 4.100 13zm3-2h-3a8 8 0 0 1 4.400-6 15.700 15.700 0 0 0-1.400 6zM12 20c-.9-1.200-1.800-3.200-2-7h4c-.2 3.800-1.100 5.800-2 7zm2.500-1a15.700 15.700 0 0 0 1.400-6h3a8 8 0 0 1-4.400 6z"/></svg>',
  pin: '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.250 7 13 7 13s7-7.750 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></svg>',
  fb: '<svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H7v4h3v8h4v-8h3l1-4h-4V8z"/></svg>',
  ig: '<svg viewBox="0 0 24 24"><path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm5 2.500a4.500 4.500 0 1 1 0 9 4.500 4.500 0 0 1 0-9zm0 2a2.500 2.500 0 1 0 0 5 2.500 2.500 0 0 0 0-5zM17.300 6a1.100 1.100 0 1 1 0 2.200 1.100 1.100 0 0 1 0-2.200z"/></svg>',
  tt: '<svg viewBox="0 0 24 24"><path d="M16.500 3c.3 2.300 1.600 3.700 4 3.900v3.200c-1.500.1-2.900-.4-4-1.200v6.100a5.800 5.800 0 1 1-5.800-5.800c.3 0 .6 0 .8.100v3.300a2.600 2.600 0 1 0 1.800 2.500V3h3.200z"/></svg>',
  send: '<svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>',
  check: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2.200"/><path d="M7 12.500l3.200 3.200L17 8.800" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  arrow: '<svg viewBox="0 0 120 60" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10c30 4 62 12 92 38"/><path d="M80 48l20 2-6-20"/></svg>'
};
const contact = (x, y, col, items, gap = 54, size = 26) => `<div class="a" style="left:${x}px;top:${y}px;color:${col}">${items.map((t, i) => `<div class="ct" style="position:absolute;top:${i * gap}px;font-size:${size}px">${I[t[0]]}<span>${t[1]}</span></div>`).join("")}</div>`;
const socials = (x, y, col, list = ["fb", "ig", "tt"]) => `<div class="soc" style="left:${x}px;top:${y}px;color:${col}">${list.map(k => `<i>${I[k]}</i>`).join("")}</div>`;
const sparks = (sd, n, x0, y0, w, h, cols, rmin = 2, rmax = 7) => { seed(sd); let o = ""; for (let i = 0; i < n; i++) { const r = rmin + rnd() * (rmax - rmin), c = cols[Math.floor(rnd() * cols.length)]; o += `<i class="a circ" style="left:${x0 + rnd() * w}px;top:${y0 + rnd() * h}px;width:${r * 2}px;height:${r * 2}px;background:${c};opacity:${.35 + rnd() * .65};box-shadow:0 0 ${r * 3}px ${c}"></i>`; } return o; };
const sesame = (sd, n, x0, y0, w, h, col = "#f6e3b4") => { seed(sd); let o = ""; for (let i = 0; i < n; i++) { const rw = 8 + rnd() * 7; o += `<i class="a" style="left:${x0 + rnd() * w}px;top:${y0 + rnd() * h}px;width:${rw}px;height:${rw * .55}px;border-radius:50%;background:${col};transform:rotate(${rnd() * 180}deg);opacity:${.55 + rnd() * .45};box-shadow:0 2px 3px rgba(0,0,0,.35)"></i>`; } return o; };
const dots = (x, y, w, h, col, op = .5, gap = 22, r = 3) => `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;color:${col};opacity:${op};background-image:radial-gradient(currentColor ${r}px,transparent ${r + .5}px);background-size:${gap}px ${gap}px"></div>`;
const starPoly = (n, inner = .84) => { let p = []; for (let i = 0; i < n * 2; i++) { const a = Math.PI * i / n, r = i % 2 ? inner : 1; p.push(`${(50 + 50 * r * Math.sin(a)).toFixed(1)}% ${(50 - 50 * r * Math.cos(a)).toFixed(1)}%`); } return `polygon(${p.join(",")})`; };
const star = (x, y, d, bg, fg, html, rot = 8, n = 18, extra = "") => `<div class="burst" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;background:${bg};color:${fg};clip-path:${starPoly(n)};transform:rotate(${rot}deg);${extra}"><div style="transform:rotate(${-rot}deg)">${html}</div></div>`;
const brush = (x, y, w, h, col, rot = 0, op = 1) => `<svg class="a" style="left:${x}px;top:${y}px;transform:rotate(${rot}deg);opacity:${op};overflow:visible" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><filter id="b${x}${y}" x="-10%" y="-30%" width="120%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".03 .35" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="${Math.round(h * .45)}"/></filter></defs><rect x="${w * .04}" y="${h * .2}" width="${w * .92}" height="${h * .6}" rx="${h * .2}" fill="${col}" filter="url(#b${x}${y})"/></svg>`;
const logoMark = (kind, col, bg, sz = 58) => {
  const m = {
    flame: '<path d="M32 6c3 9 12 13 12 25a12 12 0 0 1-24 0c0-6 3-9 6-12 0 5 3 7 5 7-3-8-1-14 1-20z" fill="BG"/>',
    bowl: '<path d="M10 28h44a22 22 0 0 1-44 0z" fill="BG"/><path d="M22 20c0-5 4-5 4-10M32 20c0-5 4-5 4-10M42 20c0-5 4-5 4-10" stroke="BG" stroke-width="3" fill="none" stroke-linecap="round"/>',
    bun: '<path d="M10 30a22 18 0 0 1 44 0z" fill="BG"/><rect x="10" y="34" width="44" height="6" rx="3" fill="BG"/><path d="M12 44h40a8 8 0 0 1-8 8H20a8 8 0 0 1-8-8z" fill="BG"/>',
    crown: '<path d="M10 44V20l12 12 10-16 10 16 12-12v24z" fill="BG"/>',
    leaf: '<path d="M14 50C14 26 28 12 52 12c0 24-14 38-38 38z" fill="BG"/><path d="M14 50L40 24" stroke="FG" stroke-width="3"/>',
    cake: '<rect x="12" y="30" width="40" height="22" rx="4" fill="BG"/><path d="M12 36c6 6 10-4 14 0s10-4 14 0 8-4 12 0" stroke="FG" stroke-width="3" fill="none"/><rect x="30" y="14" width="4" height="14" rx="2" fill="BG"/>',
    berry: '<path d="M32 54C16 42 10 30 14 22c4-8 14-6 18-2 4-4 14-6 18 2 4 8-2 20-18 32z" fill="BG"/><path d="M26 14c4 2 8 2 12 0M32 8v8" stroke="BG" stroke-width="3" fill="none" stroke-linecap="round"/>',
    wheat: '<path d="M32 56V10" stroke="BG" stroke-width="3"/><g fill="BG"><ellipse cx="24" cy="22" rx="5" ry="9" transform="rotate(-30 24 22)"/><ellipse cx="40" cy="22" rx="5" ry="9" transform="rotate(30 40 22)"/><ellipse cx="24" cy="38" rx="5" ry="9" transform="rotate(-30 24 38)"/><ellipse cx="40" cy="38" rx="5" ry="9" transform="rotate(30 40 38)"/></g>'
  }[kind].replace(/BG/g, bg).replace(/FG/g, col);
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 64 64"><circle cx="32" cy="32" r="31" fill="${col}"/><g transform="translate(32 32) scale(.62) translate(-32 -32)">${m}</g></svg>`;
};
const logo = (x, y, kind, name, sub, col, bg, size = 34, mark = 58, align = "left") => `<div class="logo" style="${align === "right" ? "right" : "left"}:${x}px;top:${y}px;color:${col}">${logoMark(kind, col, bg, mark)}<div class="t" style="font-size:${size}px">${name}<small>${sub}</small></div></div>`;
const W = (sty, html) => `<div class="a" style="${sty}">${html}</div>`;

const P = [
/* 1 — ROASTED PORK STEAK · Ironwood Grill · charcoal + orange · Amatic SC */
() => {
  return `<div class="a" style="inset:0;background:radial-gradient(ellipse at 30% 25%,#2b2b2b,#141414 70%)"></div>
  <div class="a" style="inset:0;opacity:.35;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.035) 46px 48px)"></div>
  <div class="circ" style="left:300px;top:-60px;width:880px;height:880px;background:#f08a1c;box-shadow:0 0 120px rgba(240,138,28,.35)"></div>
  <div class="circ" style="left:276px;top:-84px;width:928px;height:928px;border:3px dashed rgba(255,255,255,.55)"></div>
  <div class="circ" style="left:-210px;top:-170px;width:960px;height:960px;background:url(${C}steak.jpg) 55% 50%/cover;box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 0 10px #0d0d0d"></div>
  <img class="cut" src="${C}rosemary.png" style="left:640px;top:80px;width:150px;transform:rotate(38deg)">
  <img class="cut" src="${C}rosemary.png" style="left:900px;top:430px;width:130px;transform:rotate(-30deg)">
  ${sparks(11, 26, 380, 40, 640, 700, ["#ffd9a0", "#fff"], 1.5, 3.5)}
  <div class="a" style="left:60px;top:780px;font-family:'Amatic SC';font-weight:700;font-size:250px;line-height:.82;letter-spacing:2px;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.35)">ROASTED<br><span style="color:#f08a1c">PORK</span> STEAK</div>
  <div class="a" style="left:66px;top:700px;font-family:Caveat;font-weight:700;font-size:62px;color:#f9c06b;transform:rotate(-4deg)">Today's special</div>
  ${star(790, 800, 250, "#f08a1c", "#111", `<div style="font-family:'Amatic SC';font-weight:700;font-size:48px;letter-spacing:2px">ONLY</div><div style="font-family:'Amatic SC';font-weight:700;font-size:112px;line-height:.9">₱349</div>`, -6, 22, "filter:drop-shadow(0 14px 18px rgba(0,0,0,.5))")}
  ${brush(-40, 1150, 760, 170, "#f08a1c", -3, .95)}
  ${logo(60, 54, "flame", "Ironwood", "Grill & Bar", "#fff", "#141414", 38, 62)}
  ${contact(70, 1190, "#141414", [["phone", "0917 555 0142"], ["globe", "ironwoodgrill.ph"]], 52, 28)}
  ${socials(800, 1216, "#fff")}
  <div class="a" style="right:60px;top:70px;font-size:22px;font-weight:600;letter-spacing:.3em;color:#fff;opacity:.8">EST. 2019</div>
  <div class="grain"></div><div class="vig"></div>`;
},
/* 2 — DELICIOUS NOODLES · Wok Republic · cream + red + mustard */
() => {
  return `<div class="a" style="inset:0;background:linear-gradient(180deg,#fbf4e6,#f3e6cc)"></div>
  <div class="a" style="inset:0;background:#c8301f;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 0,3% 2%,3% 98%,97% 98%,97% 2%,3% 2%);"></div>
  ${dots(60, 1030, 220, 200, "#c8301f", .35)}
  <svg class="a" style="left:120px;top:470px" width="840" height="840" viewBox="0 0 840 840"><circle cx="420" cy="420" r="400" fill="none" stroke="#e23a24" stroke-width="64" stroke-dasharray="1100 1500" stroke-linecap="round" transform="rotate(205 420 420)"/><circle cx="420" cy="420" r="338" fill="#fff" stroke="#f0c9a0" stroke-width="3"/></svg>
  <div class="a" style="left:-60px;top:930px;width:640px;height:400px;background:#f6a81c;clip-path:polygon(0 100%,100% 100%,40% 0,0 20%)"></div>
  <img class="cut" src="${C}noodle.png" style="left:190px;top:515px;width:720px;transform:rotate(-8deg)">
  <svg class="a" style="left:790px;top:430px;overflow:visible" width="200" height="140" viewBox="0 0 200 140"><path d="M10 120C40 40 110 20 190 10" stroke="#e23a24" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M60 128C90 70 130 55 180 50" stroke="#f6a81c" stroke-width="9" fill="none" stroke-linecap="round"/></svg>
  <div class="a" style="left:0;right:0;top:150px;text-align:center;font-family:'Paytone One';font-size:150px;line-height:.9;color:#d9331f;letter-spacing:1px;text-shadow:0 5px 0 rgba(255,255,255,.9)">Delicious</div>
  <div class="a" style="left:0;right:0;top:268px;text-align:center;font-family:'Paytone One';font-size:150px;line-height:.9;color:#f6a81c;text-shadow:0 7px 0 #b25a00,0 12px 20px rgba(0,0,0,.18)">Noodles</div>
  <div class="a" style="left:0;right:0;top:405px;text-align:center;font-family:Kaushan Script;font-size:56px;color:#d9331f;transform:rotate(-3deg)">Limited Time Offer</div>
  ${star(50, 545, 250, "#161616", "#f6a81c", `<div style="font-family:'Paytone One';font-size:34px;color:#fff;letter-spacing:1px">UP TO</div><div style="font-family:'Paytone One';font-size:84px;line-height:.95;color:#f6a81c">50%</div><div style="font-family:'Paytone One';font-size:40px;color:#fff">OFF</div>`, -10, 16, "filter:drop-shadow(0 12px 16px rgba(0,0,0,.35))")}
  <div class="a" style="left:60px;right:60px;bottom:62px;height:150px;border-radius:34px;background:#fff;box-shadow:0 16px 40px rgba(120,30,10,.28);border:3px solid #f0c9a0"></div>
  ${logo(92, 1160, "bowl", "Wok Republic", "Noodle House", "#d9331f", "#fff", 30, 64)}
  ${contact(560, 1146, "#2a2a2a", [["phone", "0918 555 0198"], ["globe", "wokrepublic.ph"]], 50, 25)}

  <div class="grain" style="opacity:.22"></div>`;

/* 3 — SUPER DELICIOUS SANDWICH · The Daily Sub · dark + orange + neon swirl */
() => {
  return `<div class="a" style="inset:0;background:#cf7a0b"></div>
  <div class="a" style="left:50px;top:50px;right:50px;bottom:50px;background:radial-gradient(ellipse at 50% 55%,#33403f,#1b2224 70%);box-shadow:0 30px 70px rgba(0,0,0,.45)"></div>
  <div class="a" style="left:50px;top:50px;right:50px;bottom:50px;opacity:.5;background:radial-gradient(circle at 50% 120%,rgba(240,148,26,.55),transparent 55%)"></div>
  ${logo(100, 96, "wheat", "The Daily Sub", "Sandwich Co.", "#f3a124", "#1b2224", 28, 54)}
  <div class="a" style="right:100px;top:104px;font-size:20px;font-weight:600;letter-spacing:.2em;color:#e9e1d0;text-align:right;line-height:1.7">FOLLOW US NOW<br><span style="display:inline-flex;gap:10px;margin-top:6px;color:#f3a124">${["fb", "ig", "tt"].map(k => `<i style="width:34px;height:34px;border-radius:50%;border:2px solid currentColor;display:inline-grid;place-items:center"><span style="width:18px;height:18px;display:block">${I[k].replace('<svg', '<svg fill="currentColor"')}</span></i>`).join("")}</span></div>

  <div class="circ" style="left:190px;top:700px;width:700px;height:700px;background:radial-gradient(circle,rgba(243,161,36,.35),transparent 65%)"></div>
  <svg class="a" style="left:60px;top:640px;filter:drop-shadow(0 0 14px #fff) drop-shadow(0 0 30px rgba(255,255,255,.6))" width="960" height="560" viewBox="0 0 960 560" fill="none"><path d="M40 470C260 560 520 520 700 420C820 350 910 250 880 160" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M90 420C300 520 560 470 700 380C800 316 850 250 840 190" stroke="#fff" stroke-width="2.500" opacity=".7" stroke-linecap="round"/></svg>

  <img class="cut" src="${C}basil.png" style="left:790px;top:1010px;width:210px;transform:rotate(150deg) scaleX(-1)">
  ${star(800, 700, 190, "#f3a124", "#1b2224", `<div style="font-family:'Bebas Neue';font-size:34px;letter-spacing:2px">UP TO</div><div style="font-family:'Bebas Neue';font-size:80px;line-height:.85">50%</div><div style="font-family:'Bebas Neue';font-size:34px">OFF</div>`, 10, 14, "filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))")}
  
  <div class="a" style="left:0;right:0;top:1128px;text-align:center;font-family:Allura;font-size:78px;color:#f3a124;text-shadow:0 3px 10px rgba(0,0,0,.85)">Order now · Today's best deal</div>
  ${contact(130, 1230, "#e9e1d0", [["phone", "0920 555 0167"]], 50, 25)}
  ${contact(450, 1230, "#e9e1d0", [["globe", "dailysub.ph"]], 50, 25)}
  ${contact(700, 1230, "#e9e1d0", [["pin", "Cebu City"]], 50, 25)}
  <div class="grain"></div>`;
},
/* 4 — SUPER BURGER · Burger Forge · orange fire */
