<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<title>Instagram feed planning mockups</title>
<!-- Each feed has its own font (D.font): clinic = Jost, makeup = Playfair Display, travel = DM Sans, coffee = Bricolage Grotesque. -->
<!-- Source for the three Instagram feed mockups (images/ig-feed-*.jpg). Open with ?f=clinic | travel | makeup.
     Photos are Pexels stock photos. Brands and handles are made-up samples. Screenshot at 1600x1000. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Jost:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Bricolage+Grotesque:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden}
body{font-family:var(--f),"DM Sans",sans-serif;background:var(--bg);color:var(--ink);position:relative}
.stage{position:absolute;inset:0;background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.7),transparent 45%),radial-gradient(circle at 92% 95%,var(--bg2),transparent 55%)}
.flat{position:absolute;left:96px;top:84px;width:780px}
.flat .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.flat .t{border-radius:6px;box-shadow:0 10px 26px rgba(20,30,40,.14)}
.label{position:absolute;left:96px;top:884px;display:flex;align-items:center;gap:22px}
.sw{display:flex;gap:12px}.sw i{width:44px;height:44px;border-radius:50%;display:block;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.label .by{display:block;margin-top:7px;font-size:14px;font-weight:600;letter-spacing:.06em;opacity:1;color:var(--sig)}
.label b{font-size:22px;font-weight:700;letter-spacing:.2px}.label span{font-size:17px;opacity:.7;display:block;margin-top:2px;font-weight:500}
/* tiles */
.t{position:relative;aspect-ratio:1;overflow:hidden;container-type:inline-size;background:#ddd}
.t.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:var(--ph)}
.t.photo::after{content:"";position:absolute;inset:0;background:var(--tint);mix-blend-mode:soft-light;opacity:.55}
.t .cap{position:absolute;left:7cqw;right:7cqw;bottom:7cqw;z-index:2;color:#fff;font-weight:700;font-size:8cqw;line-height:1.12;text-shadow:0 1px 14px rgba(0,0,0,.45)}
.t .cap small{display:block;font-size:4.6cqw;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2cqw;opacity:.95}
.t.photo.shade::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(0,0,0,.5),transparent 55%)}
.t .ic{position:absolute;top:5cqw;right:5cqw;z-index:3;width:8cqw;height:8cqw;fill:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.t.text{background:#ddd}.t.text>.in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:10cqw 9cqw;gap:5cqw}.t.text.c>.in{align-items:center;text-align:center}
.t.text .k{font-size:4.4cqw;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.t.text .h{font-size:11.5cqw;font-weight:700;line-height:1.08;letter-spacing:-.01em}
.t.text .p{font-size:5cqw;font-weight:500;line-height:1.35;opacity:.9}
.t.text .b{align-self:flex-start;font-size:4.6cqw;font-weight:700;padding:2.4cqw 5.5cqw;border-radius:99px}
.t.text .brand{filter:blur(2cqw);position:absolute;left:9cqw;top:8cqw;font-size:3.8cqw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.t.text.c .b{align-self:center}
.t.text .ring{position:absolute;right:-12cqw;bottom:-12cqw;width:46cqw;height:46cqw;border-radius:50%;border:1.2cqw solid currentColor;opacity:.18}
/* phone */
.phone{position:absolute;left:1030px;top:12px;width:414px;height:882px;padding:12px;border-radius:60px;transform:scale(1.1);transform-origin:top left;background:linear-gradient(145deg,#3b4048,#15181c 45%,#0a0c0f);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14),0 40px 70px rgba(10,20,30,.32),0 12px 24px rgba(10,20,30,.2)}
.scr{position:relative;width:100%;height:100%;border-radius:49px;overflow:hidden;background:#fff;color:#111;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column}
.island{position:absolute;left:50%;top:10px;width:100px;height:29px;margin-left:-50px;border-radius:20px;background:#000;z-index:5}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:4px 34px 0 38px;font-weight:600;font-size:15px}
.status svg{height:11px;fill:#111}
.hdr{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.hdr .u{font-weight:700;font-size:18px;display:flex;align-items:center;gap:5px}.hdr .u svg{width:13px;height:13px}
.hdr .r{display:flex;gap:22px}.hdr .r svg{width:23px;height:23px;stroke:#111;fill:none;stroke-width:1.8}
.prof{flex:none;padding:4px 16px 0}
.top{display:flex;align-items:center;gap:20px}
.av{width:78px;height:78px;border-radius:50%;padding:3px;background:var(--ring);flex:none}
.av div{width:100%;height:100%;border-radius:50%;border:3px solid #fff;background:var(--av);display:grid;place-items:center;color:#fff;font:700 24px var(--f),"DM Sans";letter-spacing:.02em}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center}.stats b{display:block;font-size:17px;font-weight:700}.stats span{font-size:12px}
.bio{margin-top:8px;font-size:12.5px;line-height:1.32}.bio b{font-weight:700;display:block}.bio .cat{color:#737373}.bio .lk{color:#00376b;font-weight:600}
.btns{display:flex;gap:6px;margin-top:9px}.btns div{flex:1;height:30px;border-radius:8px;background:#efefef;display:grid;place-items:center;font-weight:600;font-size:12.5px}
.btns div.f{background:#0095f6;color:#fff}.btns div.s{flex:none;width:32px}
.hl{flex:none;display:flex;gap:10px;padding:8px 16px 6px}
.hl div{width:56px;text-align:center;font-size:10.5px}.hl i{width:52px;height:52px;border-radius:50%;border:1.5px solid #dbdbdb;padding:3px;display:block;margin:0 auto 4px}.hl i s{display:block;width:100%;height:100%;border-radius:50%;background:var(--hlbg);overflow:hidden;text-decoration:none}.hl i s img{width:100%;height:100%;object-fit:cover;display:block;filter:var(--ph)}
.tabs{flex:none;display:flex;height:34px;border-top:1px solid #efefef}.tabs div{flex:1;display:grid;place-items:center;border-bottom:1.5px solid transparent}.tabs div.on{border-color:#111}.tabs svg{width:23px;height:23px;stroke:#8e8e8e;fill:none;stroke-width:1.8}.tabs .on svg{stroke:#111}
.pg{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5px;margin-top:1.5px}
.nav{margin-top:auto;height:46px;flex:none;border-top:1px solid #efefef;display:flex;justify-content:space-around;align-items:center;padding-bottom:6px}
.nav svg{width:25px;height:25px;stroke:#111;fill:none;stroke-width:1.9}.nav .me{width:28px;height:28px;border-radius:50%;background:var(--av);border:1.5px solid #111}
.bl{filter:blur(10px)}
.home{position:absolute;bottom:8px;left:50%;width:150px;height:5px;margin-left:-75px;border-radius:3px;background:#111;z-index:4}
</style><script src="/protect.js"></script>
</head>
