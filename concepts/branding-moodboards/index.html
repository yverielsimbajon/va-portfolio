<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<title>Branding moodboards (portrait)</title>
<!-- Source for the portrait brand identity moodboards (images/brand-board-*.webp), one bond-paper sheet each.
     Open with ?f=plumbing | cafe. Screenshot at 1000x1294. Photos are Pexels stock photos. Brands are made-up mock-ups. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Archivo:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1000px;height:1294px;overflow:hidden}
body{background:#fff;color:var(--ink);font-family:var(--bf),sans-serif;position:relative}
.paper{position:absolute;inset:0;display:flex;flex-direction:column}
.hd{height:214px;flex:none;background:var(--c1);color:var(--onc1);position:relative;display:flex;align-items:center;justify-content:center;gap:22px;overflow:hidden}
.hd .mk{width:92px;height:92px;flex:none}.hd .mk svg{width:100%;height:100%;fill:var(--c3)}
.hd .tx b{display:block;font-family:var(--hf);font-weight:var(--hw);font-size:74px;line-height:.95;letter-spacing:var(--ls)}
.hd .tx small{display:block;margin-top:12px;font-size:15px;letter-spacing:.32em;text-transform:uppercase;opacity:.85}
.hd .wv{position:absolute;left:0;right:0;bottom:-2px;height:34px}.hd .wv path{fill:none;stroke:var(--c3);stroke-width:3;opacity:.9}
.bd{flex:1;padding:26px 56px 0;display:flex;flex-direction:column;gap:20px}
.lbl{font-family:var(--hf);font-size:13px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.logos{display:grid;grid-template-columns:repeat(3,1fr) 1.45fr;gap:12px;align-items:stretch}
.lg{height:104px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--hf);font-weight:var(--hw);font-size:22px;letter-spacing:var(--ls);border-radius:4px}
.lg svg{width:30px;height:30px}
.lg.o{border:2px solid var(--c1);color:var(--c1);background:#fff}
.two{display:grid;grid-template-columns:1.05fr 1fr;gap:34px}
.donut-row{display:flex;gap:22px;align-items:center}
.donut{width:150px;height:150px;border-radius:50%;flex:none;position:relative;background:conic-gradient(var(--c1) 0 44%,var(--c2) 44% 74%,var(--c3) 74% 100%)}
.donut::after{content:"";position:absolute;inset:38px;border-radius:50%;background:#fff}
.leg .it{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px}.leg i{width:16px;height:16px;border-radius:50%;flex:none}.leg b{display:block;font-weight:600}.leg span{opacity:.6;font-size:12px}
.strips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}.strips div{height:34px;border-radius:3px}
.type{display:flex;gap:22px;align-items:flex-start}
.aa{font-family:var(--hf);font-weight:var(--hw);font-size:104px;line-height:.85;letter-spacing:var(--ls);color:var(--c1)}
.fn{font-size:13px;line-height:1.5}.fn b{display:block;font-family:var(--hf);font-size:17px;font-weight:700;margin-bottom:2px}
.alpha{font-size:12.5px;letter-spacing:.05em;line-height:1.55;margin-top:6px;opacity:.8;word-break:break-all}
.sta{display:grid;grid-template-columns:1.25fr .8fr 1.35fr;gap:20px;align-items:center}
.paperl{height:196px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.09);padding:16px;position:relative}
.paperl .top{display:flex;align-items:center;gap:7px;margin-bottom:14px;font-family:var(--hf);font-size:12px;font-weight:700;color:var(--c1)}
.paperl .top svg{width:16px;height:16px;fill:var(--c2)}
.paperl .ln{height:5px;background:#ececec;margin-bottom:7px;border-radius:3px}
.paperl .band{position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--c1)}
.cards{display:grid;gap:12px}.bc{height:78px;border-radius:4px;padding:10px 12px;font-family:var(--hf);box-shadow:0 8px 18px rgba(0,0,0,.14);display:flex;flex-direction:column;justify-content:space-between}
.bc b{font-size:13px;font-weight:var(--hw);letter-spacing:var(--ls)}.bc small{font-size:9px;opacity:.85;line-height:1.35;font-family:var(--bf)}
.pic{height:196px;position:relative;display:grid;place-items:center}
.van{position:relative;width:100%}
.van .body{height:100px;background:#fff;border:2px solid var(--c1);border-radius:16px 34px 8px 8px;position:relative;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.12)}
.van .body::before{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:var(--c1)}
.van .body::after{content:"";position:absolute;right:0;top:0;width:52px;height:100%;background:linear-gradient(110deg,transparent 45%,var(--c4) 46%)}
.van .nm{position:absolute;left:18px;top:14px;font-family:var(--hf);font-weight:var(--hw);color:var(--c1);font-size:22px;letter-spacing:var(--ls);display:flex;align-items:center;gap:7px}
.van .nm svg{width:22px;height:22px;fill:var(--c2)}
.van .ph{position:absolute;left:18px;top:50px;font-size:11px;color:var(--c1);opacity:.8}
.van .wh{position:absolute;bottom:-14px;width:36px;height:36px;border-radius:50%;background:#222;border:6px solid #cfd6dc}
.cup{position:relative;width:140px;height:182px}
.cup .lid{position:absolute;left:-6px;right:-6px;top:0;height:20px;background:var(--c3);border-radius:8px 8px 4px 4px;box-shadow:0 4px 8px rgba(0,0,0,.12)}
.cup .cb{position:absolute;left:0;right:0;top:20px;bottom:0;background:var(--c4);clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);box-shadow:0 10px 22px rgba(0,0,0,.14)}
.cup .sl{position:absolute;left:0;right:0;top:66px;height:68px;background:var(--c1);clip-path:polygon(2.5% 0,97.5% 0,92% 100%,8% 100%);display:grid;place-items:center;color:var(--onc1);font-family:var(--hf);font-weight:var(--hw);font-size:15px;letter-spacing:var(--ls)}
.cup .sl svg{width:20px;height:20px;fill:var(--c3);margin-bottom:2px}
.mood{display:grid;grid-template-columns:1.2fr 1fr 1fr;grid-template-rows:118px 118px;gap:8px}
.mood img{width:100%;height:100%;object-fit:cover;display:block;filter:var(--ph)}
.mood .tall{grid-row:span 2}
.words{display:flex;gap:9px;justify-content:center;margin-top:14px}.words span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:7px 15px;border:1px solid var(--c1);border-radius:99px;color:var(--c1);font-weight:600}
.ft{flex:none;height:56px;background:var(--c1);color:var(--onc1);display:flex;align-items:center;justify-content:center;font-family:var(--hf);font-size:15px;font-weight:600;letter-spacing:.08em}
</style></head>
<body>
<div class="paper">
  <div class="hd"><div class="mk" id="mk"></div><div class="tx"><b id="wm"></b><small id="tag"></small></div>
    <svg class="wv" viewBox="0 0 1000 34" preserveAspectRatio="none"><path d="M0 18c40-18 80-18 120 0s80 18 120 0 80-18 120 0 80 18 120 0 80-18 120 0 80 18 120 0 80-18 120 0 80 18 120 0 80-18 120 0 80 18 120 0"/></svg></div>
  <div class="bd">
    <div><div class="lbl">Brand logo</div><div class="logos" id="logos"></div></div>
    <div class="two">
      <div><div class="lbl">Brand color</div><div class="donut-row"><div class="donut"></div><div class="leg" id="leg"></div></div><div class="strips" id="strips"></div></div>
      <div><div class="lbl">Typography</div><div class="type"><div class="aa">Aa</div><div class="fn"><b id="hfn"></b>Headings<div class="alpha">ABCDEFGHIJKLMNOPQRSTUVWXYZ 0123456789</div><b id="bfn" style="font-family:var(--bf);margin-top:12px"></b>Body text<div class="alpha" style="font-family:var(--bf)">abcdefghijklmnopqrstuvwxyz</div></div></div></div>
    </div>
    <div><div class="lbl">Stationery &amp; branding</div><div class="sta" id="sta"></div></div>
    <div><div class="lbl">Mood board</div><div class="mood" id="mood"></div><div class="words" id="words"></div></div>
  </div>
  <div class="ft">Designed by Yours Truly, Maria Simbajon</div>
</div>
<script>
const px = (id, w = 700) => `https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&w=${w}&h=${w}&fit=crop`;
const DROP = '<svg viewBox="0 0 24 24"><path d="M12 2.5C12 2.5 5 10.2 5 15.2a7 7 0 0 0 14 0c0-5-7-12.7-7-12.7zM9 15.5a3 3 0 0 0 3 3" fill-rule="evenodd"/></svg>';
const LEAF = '<svg viewBox="0 0 24 24"><path d="M20 3C10 3 4 8.5 4 15c0 2 .8 3.700 2 5 1-5 4-8.500 9-10.500-4 3-6.500 6.500-7.500 11C16 20.500 20 14 20 3z"/></svg>';
const B = {
  plumbing: { name: "Bluewave", full: "Bluewave Plumbing", tag: "Plumbing & Gas · Fast, reliable repairs", hf: "Archivo", bf: "Inter", hw: 800, ls: "-.01em", mark: DROP,
    c: ["#12304f", "#1f8fc4", "#f28c28", "#dbeef8", "#f4f8fb"], names: ["Deep Navy", "Aqua", "Copper Orange"], ink: "#12304f", onc1: "#fff", line: "rgba(18,48,79,.16)", ph: "saturate(.95)",
    photos: [6419128, 30560253, 8486978, 7045908, 28169591, 3500006], words: ["Reliable", "Fast", "Trusted"], contact: "1300 000 000 · bluewaveplumbing.com.au", cds: ["Licensed plumber", "24/7 emergency"], pic: "van" },
  cafe: { name: "Fernwood", full: "Fernwood Coffee Co.", tag: "Specialty coffee · Slow mornings", hf: "Space Grotesk", bf: "DM Sans", hw: 700, ls: "-.02em", mark: LEAF,
    c: ["#2f4a3a", "#c46a3b", "#d9c7a8", "#efe6d6", "#1d2a22"], names: ["Fern", "Terracotta", "Sand"], ink: "#1d2a22", onc1: "#f3ecdc", line: "rgba(47,74,58,.2)", ph: "saturate(.95) sepia(.06)",
    photos: [33653475, 6747870, 13240965, 11340975, 12900864, 30403209], words: ["Slow", "Earthy", "Welcoming"], contact: "hello@fernwood.coffee · Fitzroy, VIC", cds: ["Head roaster", "Order ahead"], pic: "cup" }
};
const key = new URLSearchParams(location.search).get("f") || "plumbing", D = B[key], s = document.documentElement.style, $ = id => document.getElementById(id);
[["--c1", D.c[0]], ["--c2", D.c[1]], ["--c3", D.c[2]], ["--c4", D.c[3]], ["--ink", D.ink], ["--onc1", D.onc1], ["--line", D.line], ["--hf", `"${D.hf}"`], ["--bf", `"${D.bf}"`], ["--hw", D.hw], ["--ls", D.ls], ["--ph", D.ph]].forEach(([k, v]) => s.setProperty(k, v));
$("mk").innerHTML = D.mark; $("wm").textContent = D.name; $("tag").textContent = D.tag;
$("hfn").textContent = D.hf; $("bfn").textContent = D.bf;
$("logos").innerHTML = [[D.c[0], D.onc1], [D.c[3], D.c[0]], [D.c[1], "#fff"]].map(([b, f]) => `<div class="lg" style="background:${b};color:${f}"><span style="display:contents">${D.mark.replace("<svg", `<svg style="fill:${f}"`)}</span>${D.name}</div>`).join("") +
  `<div class="lg o">${D.mark.replace("<svg", '<svg style="fill:var(--c1)"')}${D.full.replace(" Co.", "")}</div>`;
$("leg").innerHTML = D.names.map((n, i) => `<div class="it"><i style="background:${D.c[i]}"></i><div><b>${n}</b><span>${D.c[i].toUpperCase()}</span></div></div>`).join("");
$("strips").innerHTML = D.c.map(c => `<div style="background:${c};box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></div>`).join("");
const letter = `<div class="paperl"><div class="top">${D.mark}<span>${D.full}</span></div><div class="ln" style="width:70%"></div><div class="ln"></div><div class="ln"></div><div class="ln" style="width:85%"></div><div class="ln" style="width:55%;margin-top:14px"></div><div class="ln" style="width:75%"></div><div class="band"></div></div>`;
const cards = `<div class="cards"><div class="bc" style="background:var(--c1);color:var(--onc1)"><b>${D.name}</b><small>${D.cds[0]}<br>${D.contact.split(" · ")[0]}</small></div><div class="bc" style="background:var(--c3);color:var(--ink)"><b>${D.name}</b><small>${D.cds[1]}<br>${D.contact.split(" · ")[1] || ""}</small></div></div>`;
const van = `<div class="van"><div class="body"><div class="nm">${D.mark}${D.name}</div><div class="ph">${D.contact}</div></div><div class="wh" style="left:34px"></div><div class="wh" style="right:40px"></div></div>`;
const cup = `<div class="cup"><div class="lid"></div><div class="cb"></div><div class="sl">${D.mark}${D.name}</div></div>`;
$("sta").innerHTML = letter + cards + `<div class="pic">${D.pic === "van" ? van : cup}</div>`;
$("mood").innerHTML = `<img class="tall" src="${px(D.photos[0], 900)}">` + D.photos.slice(1, 5).map(p => `<img src="${px(p)}">`).join("");
$("words").innerHTML = D.words.map(w => `<span>${w}</span>`).join("");
</script></body></html>
